{% set name = "myerson" %}
{% set version = "1.0.0" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/myerson-{{ version }}.tar.gz
  sha256: 24df8a85d16b3810828896f56ae08fc91c80d91fa3efd5e468efc5b4e3483939

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - flit-core >=3.2,<4
    - pip
  run:
    - python >={{ python_min }}
    - tqdm
    - numpy >=1.25
    - networkx >=3.1
  run_constrained:
    - pytorch >=2.0.1,<3
    - pytorch_geometric >=2.3.1,<3
    - chemprop >=2,<3


test:
  imports:
    - myerson
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/kochgroup/myerson
  summary: A python package to calculate Myerson values from game theory and use them as explanations for graph neural networks.
  dev_url: https://github.com/kochgroup/myerson
  license: MIT
  license_file: LICENSE
  doc_url: https://myerson.readthedocs.io

extra:
  recipe-maintainers:
    - SamuelHomberg
